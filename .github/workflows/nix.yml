name: Nix

on:
  push:
    branches:
      - monarchic
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS) }}
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop .#check --command make nix-tests

  fmt:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS) }}
    steps:
      - name: Checkout tree
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix develop .#fmt --command make nix-fmt
